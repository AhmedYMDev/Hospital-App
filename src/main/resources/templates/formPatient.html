<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{template}">
<head>
    <title>Nouveau patient</title>
</head>
<body>
<section layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <h4 class="mb-0">
                        <i class="bi bi-person-plus"></i>
                        Nouveau patient
                    </h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/admin/save}" method="post" th:object="${patient}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="hidden" name="page" th:value="${page}">
                        <input type="hidden" name="keyword" th:value="${keyword}">
                        <input type="hidden" name="size" th:value="${size}">

                        <div class="mb-3">
                            <label for="nom" class="form-label">Nom</label>
                            <input id="nom" type="text" class="form-control" th:field="*{nom}"
                                   th:classappend="${#fields.hasErrors('nom')} ? 'is-invalid'">
                            <div class="text-danger" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="dateNaissance" class="form-label">Date de naissance</label>
                            <input id="dateNaissance" type="date" class="form-control" th:field="*{dateNaissance}"
                                   th:classappend="${#fields.hasErrors('dateNaissance')} ? 'is-invalid'">
                            <div class="text-danger" th:if="${#fields.hasErrors('dateNaissance')}" th:errors="*{dateNaissance}"></div>
                        </div>

                        <div class="mb-3 form-check">
                            <input id="malade" type="checkbox" class="form-check-input" th:field="*{malade}">
                            <label for="malade" class="form-check-label">Malade</label>
                        </div>

                        <div class="mb-3">
                            <label for="score" class="form-label">Score</label>
                            <input id="score" type="number" class="form-control" th:field="*{score}"
                                   th:classappend="${#fields.hasErrors('score')} ? 'is-invalid'">
                            <div class="text-danger" th:if="${#fields.hasErrors('score')}" th:errors="*{score}"></div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a class="btn btn-secondary" th:href="@{/user/index(page=${page}, keyword=${keyword}, size=${size})}">
                                <i class="bi bi-arrow-left"></i>
                                Retour
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-save"></i>
                                Enregistrer
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
